# The public website.
app = "parrot-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile.next"
  [build.args]
    APP = "web"
    NEXT_PUBLIC_BACKEND_URL = "https://parrot-web.fly.dev"
    NEXT_PUBLIC_SITE_URL = "https://parrot-web.fly.dev"
    BACKEND_ORIGIN = "https://parrot-backend.fly.dev"

[env]
  NODE_ENV = "production"
  # The site proxies /api and /media to the backend, so the sign-in cookie is first-party.
  BACKEND_ORIGIN = "https://parrot-backend.fly.dev"
  PUBLIC_WEB_URL = "https://parrot-web.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/icon.svg"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
