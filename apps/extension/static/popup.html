<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parrot</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1b1a17;
        --soft: #5d574c;
        --rule: #e6d9c4;
        --paper: #fdf7ef;
        --raised: #fffdfa;
        --mango: #f26a1b;
        --mango-deep: #c84f07;
        --teal: #0f7a6c;
        --bad: #b32a3f;
        --warn-wash: #fdeadc;
        --on-accent: #fffdfa;
        --focus: #2b5fd9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --ink: #f6efe3;
          --soft: #bdb3a1;
          --rule: #403a2f;
          --paper: #14130f;
          --raised: #1d1b16;
          --mango: #ff8a3d;
          --mango-deep: #ffa566;
          --teal: #4fd1b9;
          --bad: #ff8095;
          --warn-wash: #30200f;
          --on-accent: #17120b;
          --focus: #9bb8ff;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        background: var(--paper);
        color: var(--ink);
        font: 13px/18px ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--rule);
      }
      header img { width: 32px; height: 32px; }
      h1 {
        margin: 0;
        font: 700 18px/22px 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      }
      .tagline { margin: 0; color: var(--soft); }
      section { padding: 12px 16px; border-bottom: 1px solid var(--rule); }
      section:last-child { border-bottom: 0; }
      .state { display: flex; align-items: center; gap: 8px; font-weight: 700; }
      .light { width: 9px; height: 9px; border-radius: 999px; background: var(--soft); }
      .state[data-state="on"] .light { background: var(--teal); }
      .state[data-state="off"] .light { background: var(--bad); }
      .muted { color: var(--soft); margin: 4px 0 0; }
      label { display: block; font-weight: 700; margin-bottom: 6px; }
      form { display: flex; gap: 6px; }
      input {
        flex: 1;
        min-width: 0;
        height: 30px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--rule);
        background: var(--raised);
        color: var(--ink);
        font: inherit;
      }
      button {
        height: 30px;
        padding: 0 12px;
        border-radius: 999px;
        border: 0;
        background: var(--mango);
        color: var(--on-accent);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--mango-deep); }
      .note { margin: 6px 0 0; color: var(--soft); min-height: 18px; }
      .test {
        padding: 10px 12px;
        border-radius: 10px;
        background: var(--warn-wash);
      }
      .test p { margin: 0 0 4px; font-weight: 700; }
      .test ul { margin: 0; padding-left: 18px; }
      a { color: var(--mango-deep); font-weight: 700; }
      a:focus-visible, button:focus-visible, input:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" alt="" />
      <div>
        <h1 id="name">Parrot</h1>
        <p class="tagline" id="tagline"></p>
      </div>
    </header>

    <section>
      <div class="state" id="state" data-state="checking">
        <span class="light" aria-hidden="true"></span>
        <span id="state-text">…</span>
      </div>
      <p class="muted" id="active-on"></p>
    </section>

    <section id="test-section" hidden>
      <div class="test" id="test"></div>
    </section>

    <section>
      <label for="server" id="server-label"></label>
      <form id="server-form">
        <input id="server" type="url" spellcheck="false" autocomplete="off" />
        <button type="submit" id="save"></button>
      </form>
      <p class="note" id="server-note" role="status"></p>
    </section>

    <section id="links" hidden>
      <a id="dashboard" target="_blank" rel="noopener"></a>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
