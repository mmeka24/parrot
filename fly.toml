# Parrot backend. One always-on machine: all state is in memory, so scaling out
# or auto-stopping would split or lose it. Dub media lives on the /data volume.
app = "parrot-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  BACKEND_PORT = "8080"
  MEDIA_STORAGE_DIR = "/data/media"
  USERS_DB_PATH = "/data/users.db"

[mounts]
  source = "parrot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
